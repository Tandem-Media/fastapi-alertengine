name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── SDK tests — run when free SDK changes ─────────────────────────────────
  sdk:
    name: SDK Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'fastapi_alertengine/') ||
      contains(github.event.pull_request.changed_files, 'tests/') ||
      contains(github.event.pull_request.changed_files, 'pyproject.toml')

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest fakeredis httpx anyio pytest-asyncio

      - name: Run SDK tests
        run: pytest tests/ -v -k "not orchestrator"

  # ── Orchestrator tests — run when orchestrator changes ────────────────────
  orchestrator:
    name: Orchestrator Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files, 'orchestrator/') ||
      contains(github.event.pull_request.changed_files, 'tests/')

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest fakeredis httpx anyio pytest-asyncio

      - name: Install orchestrator dependencies
        run: pip install -r orchestrator/requirements.txt

      - name: Run all tests
        run: pytest tests/ -v

  # ── Docs/config changes — lightweight check only ──────────────────────────
  lint:
    name: Lint & Config Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest fakeredis httpx anyio pytest-asyncio

      - name: Install orchestrator dependencies
        run: pip install -r orchestrator/requirements.txt

      - name: Run all tests (always — safety net)
        run: pytest tests/ -v
