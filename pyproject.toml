[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-alertengine"
version = "1.6.0"
description = "FastAPI incident intelligence with human-approved recovery. P95 latency tracking, adaptive health scoring, and WhatsApp/Telegram recovery approvals that require explicit human authorization before any action executes."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tandem Media" }
]
license = "MIT"
dependencies = [
  "fastapi",
  "redis",
  "pydantic-settings",
  "httpx",
  "PyJWT",
]

[project.optional-dependencies]
dev = [
  "uvicorn[standard]",
  "pytest",
  "pytest-asyncio",
  "httpx",
  "fakeredis",
  "anyio",
]

[project.urls]
Homepage = "https://github.com/Tandem-Media/fastapi-alertengine"
