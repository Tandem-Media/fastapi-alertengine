[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-alertengine"
version = "1.7.0"
description = "Human-authorized incident recovery for FastAPI — detect, diagnose, approve, execute, audit. P95 latency tracking, adaptive health scoring, and WhatsApp/Telegram recovery approvals that require explicit human authorization before any action executes."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tofamba" }
]
license = "MIT"
dependencies = [
  "fastapi",
  "redis",
  "pydantic-settings",
  "httpx",
  "PyJWT",
]

[project.optional-dependencies]
dev = [
  "uvicorn[standard]",
  "pytest",
  "pytest-asyncio",
  "httpx",
  "fakeredis",
  "anyio",
  "black",
  "mypy",
  "freezegun",
]

[project.urls]
Homepage = "https://github.com/tofamba/fastapi-alertengine"